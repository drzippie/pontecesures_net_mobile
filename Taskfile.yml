version: '3'

vars:
  APP_NAME: "pontecesures-net-mobile"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker

  device:ios:
    summary: Builds, signs and installs the app on an iPhone (development signing)
    desc: |
      Usage: wails3 task device:ios [IOS_PROFILE=path.mobileprovision] [DEVICE_ID=<udid>]

      Uses the Wails device packaging (ios:package IOS_PLATFORM=device), which
      links the Go archive with -force_load and embeds icons and the launch
      screen. The generated Xcode project is not used: in Wails v3.1.0 it
      disables signing, names the executable "wailsapp" while PRODUCT_NAME
      differs, does not force-load WailsAppDelegate and needs `go` in Xcode's
      PATH.

      Needs a development provisioning profile for the team (default
      bin/dev.mobileprovision; Xcode's "iOS Team Provisioning Profile" or one
      downloaded from developer.apple.com) and its certificate's identity in
      the keychain. The iPhone can be on the same Wi-Fi network; Developer
      Mode must be on. See docs/DEVELOPMENT.md.
    vars:
      IOS_PROFILE: '{{.IOS_PROFILE | default "bin/dev.mobileprovision"}}'
      BUNDLE_ID: net.pontecesures.app
      ENTITLEMENTS: bin/dev.entitlements
      IDENTITY:
        sh: python3 scripts/ios_signing.py identity "{{.IOS_PROFILE}}" 2>/dev/null || true
    preconditions:
      - sh: test -f "{{.IOS_PROFILE}}"
        msg: "Provisioning profile not found at {{.IOS_PROFILE}}. See docs/DEVELOPMENT.md (iPhone section)."
      - sh: test -n "{{.IDENTITY}}"
        msg: "No keychain identity matches a certificate in {{.IOS_PROFILE}}. Check Xcode > Settings > Accounts > Manage Certificates."
    cmds:
      - python3 scripts/ios_signing.py entitlements "{{.IOS_PROFILE}}" {{.BUNDLE_ID}} {{.ENTITLEMENTS}}
      - wails3 task ios:package IOS_PLATFORM=device CODESIGN_IDENTITY={{.IDENTITY}} PROVISIONING_PROFILE="{{.IOS_PROFILE}}" ENTITLEMENTS_FILE={{.ENTITLEMENTS}}
      - |
        DEVICE="{{.DEVICE_ID}}"
        if [ -z "$DEVICE" ]; then
          TMP=$(mktemp)
          xcrun devicectl list devices --json-output "$TMP" >/dev/null 2>&1
          DEVICE=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(next((x['hardwareProperties']['udid'] for x in d['result']['devices'] if x.get('hardwareProperties',{}).get('reality')=='physical' and x['hardwareProperties'].get('deviceType')=='iPhone'), ''))" "$TMP")
          rm -f "$TMP"
        fi
        if [ -z "$DEVICE" ]; then echo "No iPhone found. Connect it (cable or same Wi-Fi) and unlock it."; exit 1; fi
        echo "Installing on $DEVICE..."
        xcrun devicectl device install app --device "$DEVICE" "{{.BIN_DIR}}/{{.APP_NAME}}.app" >/dev/null
        xcrun devicectl device process launch --terminate-existing --device "$DEVICE" {{.BUNDLE_ID}}

  store:ios:
    summary: Builds the App Store / TestFlight .ipa (distribution signing)
    desc: |
      Usage: wails3 task store:ios [BUMP=patch|minor|major|none]
             [APP_VERSION=X.Y.Z] [BUILD_NUMBER=...]
             [IOS_STORE_PROFILE=path.mobileprovision]

      Same build as device:ios, signed with the "Apple Distribution"
      certificate and an App Store Connect provisioning profile (default
      bin/store.mobileprovision).

      Every store build gets a new version: the patch number is bumped by
      default (scripts/version.py updates config, iOS, Android, Go and the
      frontend); BUMP=minor/major, APP_VERSION=X.Y.Z to set it, BUMP=none to
      keep it. Commit the version change afterwards. The build number
      (CFBundleVersion) is the build time (YYMMDD.HHMM) unless BUILD_NUMBER
      is set.

      Upload the result with `wails3 task store:ios:upload` or the
      Transporter app. See docs/DEVELOPMENT.md (App Store section).
    vars:
      IOS_STORE_PROFILE: '{{.IOS_STORE_PROFILE | default "bin/store.mobileprovision"}}'
      BUNDLE_ID: net.pontecesures.app
      ENTITLEMENTS: bin/store.entitlements
      BUMP: '{{.BUMP | default "patch"}}'
      APP_VERSION: '{{.APP_VERSION | default ""}}'
      BUILD_NUMBER:
        sh: echo "${BUILD_NUMBER:-$(date +%y%m%d.%H%M)}"
      IDENTITY:
        sh: python3 scripts/ios_signing.py identity "{{.IOS_STORE_PROFILE}}" 2>/dev/null || true
    preconditions:
      - sh: test -f "{{.IOS_STORE_PROFILE}}"
        msg: "App Store profile not found at {{.IOS_STORE_PROFILE}}. See docs/DEVELOPMENT.md (App Store section)."
      - sh: test -n "{{.IDENTITY}}"
        msg: "No keychain identity matches the Apple Distribution certificate in {{.IOS_STORE_PROFILE}}."
    cmds:
      - |
        {{if .APP_VERSION}}python3 scripts/version.py set {{.APP_VERSION}}{{else if ne .BUMP "none"}}python3 scripts/version.py bump {{.BUMP}}{{else}}python3 scripts/version.py get{{end}}
      - python3 scripts/ios_signing.py entitlements "{{.IOS_STORE_PROFILE}}" {{.BUNDLE_ID}} {{.ENTITLEMENTS}}
      - wails3 task ios:package:ipa IOS_PLATFORM=device CODESIGN_IDENTITY={{.IDENTITY}} PROVISIONING_PROFILE="{{.IOS_STORE_PROFILE}}" ENTITLEMENTS_FILE={{.ENTITLEMENTS}} BUILD_NUMBER={{.BUILD_NUMBER}}
      - codesign --verify --deep --strict "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - echo "Version $(python3 scripts/version.py get) ({{.BUILD_NUMBER}}) ready at {{.BIN_DIR}}/{{.APP_NAME}}.ipa"

  store:ios:upload:
    summary: Validates and uploads bin/<app>.ipa to App Store Connect (TestFlight)
    desc: |
      Needs an App Store Connect API key: set ASC_KEY_ID and ASC_ISSUER_ID and
      put AuthKey_<ASC_KEY_ID>.p8 in ~/.appstoreconnect/private_keys/.
    preconditions:
      - sh: test -f "{{.BIN_DIR}}/{{.APP_NAME}}.ipa"
        msg: "Run `wails3 task store:ios` first."
      - sh: test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID"
        msg: "Set ASC_KEY_ID and ASC_ISSUER_ID (App Store Connect > Users and Access > Integrations)."
    cmds:
      - xcrun altool --validate-app -f "{{.BIN_DIR}}/{{.APP_NAME}}.ipa" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - xcrun altool --upload-app -f "{{.BIN_DIR}}/{{.APP_NAME}}.ipa" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
