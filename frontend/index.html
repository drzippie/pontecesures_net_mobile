<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Pontecesures.net</title>
  <script type="module" src="/src/main.ts"></script>
</head>
<body x-data="app" x-cloak>

  <!-- ===== Masthead ===== -->
  <header class="sticky top-0 z-30 bg-chrome text-white pt-safe shadow-sm" :inert="route.name === 'article' || lightbox.open">
    <div class="flex items-center gap-3 px-4 h-13">
      <button type="button" class="flex items-baseline gap-2 font-display font-bold text-[1.32rem] tracking-tight"
              @click="go({ name: 'home' }); window.scrollTo({ top: 0, behavior: 'smooth' })">
        <span>Pontecesures<span class="text-tella">.</span>net</span>
        <small class="font-sans font-normal text-[.62rem] uppercase tracking-[.14em] opacity-70" x-text="t.since"></small>
      </button>
      <button type="button" class="ml-auto -mr-2 flex size-11 items-center justify-center rounded-full active:bg-white/10" x-show="isListView && base.name !== 'search'"
              :aria-label="t.feed.refresh" @click="refresh()">
        <svg class="size-5" :class="list.loading && 'animate-spin'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>

    <!-- Section chips (portada / sección) -->
    <nav class="flex gap-2 overflow-x-auto no-scrollbar px-4 pb-3" x-show="(base.name === 'home' || base.name === 'section') && categories.length">
      <a :href="'#/'" class="shrink-0 rounded-full px-3.5 py-1.5 text-sm font-semibold transition-colors"
         :class="currentCategory === 0 ? 'bg-white text-chrome' : 'bg-white/10 text-white'" :aria-current="currentCategory === 0 ? 'page' : null" x-text="t.feed.all"></a>
      <template x-for="c in categories.slice(0, 14)" :key="c.id">
        <a :href="'#/seccion/' + c.id" class="shrink-0 rounded-full px-3.5 py-1.5 text-sm font-semibold transition-colors"
           :class="currentCategory === c.id ? 'bg-white text-chrome' : 'bg-white/10 text-white'" :aria-current="currentCategory === c.id ? 'page' : null" x-text="c.name"
           x-effect="currentCategory === c.id && $el.scrollIntoView({ inline: 'center', block: 'nearest' })"></a>
      </template>
    </nav>
  </header>

  <main class="pb-[calc(4.5rem+var(--sa-bottom))]" :inert="route.name === 'article' || lightbox.open">

    <!-- ===== Search box ===== -->
    <div x-show="base.name === 'search'" class="px-4 pt-4">
      <label class="flex items-center gap-2 rounded-xl bg-surface border border-line px-3 h-12 focus-within:border-verdemar">
        <svg class="size-5 text-muted shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input x-ref="searchInput" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off"
               class="flex-1 bg-transparent outline-none text-base placeholder:text-muted"
               :placeholder="t.search.placeholder" :aria-label="t.search.placeholder" x-model="search.q" @input="onSearchInput()" @keydown.enter="$el.blur()" />
        <button type="button" x-show="search.q" @click="clearSearch()" class="-mr-2 flex size-11 items-center justify-center text-muted" :aria-label="t.search.clear">
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </label>
      <!-- Filters: section and order -->
      <div class="mt-3 flex items-center gap-2">
        <label class="relative min-w-0 flex-1">
          <span class="sr-only" x-text="t.search.section"></span>
          <select x-model.number="search.category" @change="rerunSearch()"
                  class="h-10 w-full appearance-none truncate rounded-lg border border-line bg-surface pl-3 pr-8 text-sm text-ink">
            <option value="0" x-text="t.search.allSections"></option>
            <template x-for="c in categories" :key="c.id">
              <option :value="c.id" x-text="c.name"></option>
            </template>
          </select>
          <svg class="pointer-events-none absolute right-2.5 top-1/2 size-4 -translate-y-1/2 text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </label>
        <div class="flex shrink-0 rounded-lg bg-line-soft p-0.5" role="radiogroup" :aria-label="t.search.order">
          <template x-for="o in ['relevance', 'date']" :key="o">
            <button type="button" role="radio" :aria-checked="search.order === o"
                    @click="if (search.order !== o) { search.order = o; rerunSearch() }"
                    class="rounded-md px-2.5 py-1.5 text-xs font-semibold"
                    :class="search.order === o ? 'bg-raised text-ink shadow-sm' : 'text-muted'"
                    x-text="o === 'relevance' ? t.search.relevance : t.search.newest"></button>
          </template>
        </div>
      </div>
      <p class="mt-3 text-sm text-muted" x-show="search.q.trim().length < 3" x-text="t.search.hint"></p>
      <p class="mt-3 text-sm text-muted" x-show="search.ran && search.total > 0"
         x-text="fmt(t.search.results, { n: number(search.total) })"></p>
      <p class="mt-6 text-center text-muted" x-show="search.ran && !search.loading && !search.error && search.items.length === 0"
         x-text="fmt(t.search.noResults, { q: search.ran })"></p>
    </div>

    <!-- Pull-to-refresh indicator -->
    <div x-show="isListView" class="flex justify-center overflow-hidden transition-[height] duration-150"
         :style="'height:' + (pull > 0 ? pull : (list.loading && list.items.length && window.scrollY <= 0 ? 48 : 0)) + 'px'" aria-hidden="true">
      <span class="mt-3 flex size-8 items-center justify-center rounded-full bg-surface shadow">
        <svg class="size-5 text-verdemar" :class="(list.loading || pull >= pullTrigger) && 'animate-spin'"
             :style="pull > 0 && pull < pullTrigger ? 'transform: rotate(' + (pull / pullTrigger) * 300 + 'deg)' : ''"
             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </span>
    </div>

    <!-- ===== Post list (portada, sección, búsqueda) ===== -->
    <section x-show="isListView" class="px-4 pt-4 space-y-4">
      <h1 x-show="base.name === 'section' && sectionName" class="font-display text-2xl font-bold" x-text="sectionName"></h1>
      <h1 x-show="base.name === 'saved'" class="font-display text-2xl font-bold" x-text="t.saved.title"></h1>
      <p x-show="base.name === 'saved' && list.page > 0 && !list.items.length" class="py-6 text-center text-muted leading-relaxed" x-text="t.saved.empty"></p>

      <!-- Weather: one discreet line on the front page; tap for the full forecast. -->
      <template x-if="base.name === 'home' && today">
        <a href="#/tiempo" class="flex items-center gap-3 rounded-xl bg-surface border border-line-soft px-3 py-2 shadow-sm active:bg-line-soft"
           :aria-label="t.weather.more">
          <img :src="skyIcon(today.sky)" alt="" class="size-8 shrink-0" @error="$el.style.visibility='hidden'" />
          <span class="min-w-0 flex-1 truncate text-sm">
            <span class="font-semibold" x-text="t.weather.today"></span>
            <span class="text-muted" x-text="skyText(today.sky) ? '· ' + skyText(today.sky) : ''"></span>
          </span>
          <span class="shrink-0 text-sm tabular-nums">
            <span class="font-semibold" x-text="today.max != null ? today.max + '°' : ''"></span>
            <span class="text-muted" x-text="today.min != null ? today.min + '°' : ''"></span>
          </span>
          <span class="shrink-0 flex items-center gap-0.5 text-xs text-verdemar tabular-nums" x-show="rainMax(today) != null">
            <svg class="size-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.7c-.3 0-.6.2-.8.4C9.6 5.2 5 11 5 14.6A7 7 0 0 0 19 14.6C19 11 14.4 5.2 12.8 3.1a1 1 0 0 0-.8-.4z"/></svg>
            <span x-text="rainMax(today) + '%'"></span>
          </span>
          <svg class="size-4 shrink-0 text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </a>
      </template>

      <div x-show="list.stale" class="rounded-lg bg-tella/10 text-tella text-sm px-3 py-2" x-text="t.offline"></div>

      <template x-for="(p, i) in list.items" :key="p.id">
        <article class="rounded-2xl bg-surface shadow-sm border border-line-soft overflow-hidden active:scale-[.99] transition-transform">
          <button type="button" class="block w-full text-left" @click="showPost(p)">
            <template x-if="p.image">
              <div class="bg-line-soft" :class="p.image.landscape ? 'aspect-[16/9]' : 'flex justify-center'">
                <img :src="p.image.url" :alt="p.image.alt" loading="lazy" decoding="async"
                     :class="p.image.landscape ? 'size-full object-cover' : 'max-h-[26rem] w-auto object-contain'"
                     :width="p.image.width || null" :height="p.image.height || null"
                     @error="$el.parentElement.classList.add('hidden')" />
              </div>
            </template>
            <div class="p-4">
              <p class="text-xs font-semibold uppercase tracking-wider text-tella" x-text="mainCategory(p)"></p>
              <h2 class="mt-1 font-display font-semibold leading-snug" :class="i === 0 && base.name === 'home' ? 'text-2xl' : 'text-xl'" x-text="p.title"></h2>
              <p class="mt-2 text-[.95rem] leading-relaxed text-muted line-clamp-3" x-show="p.excerpt" x-text="p.excerpt"></p>
              <p class="mt-3 text-xs text-muted">
                <span x-text="when(p)"></span><template x-if="p.author"><span> · <span x-text="p.author"></span></span></template>
              </p>
            </div>
          </button>
        </article>
      </template>

      <!-- Loading / error / end -->
      <div class="py-6 text-center text-sm text-muted">
        <template x-if="list.loading">
          <div class="flex items-center justify-center gap-2">
            <span class="size-4 rounded-full border-2 border-verdemar border-t-transparent animate-spin"></span>
            <span x-text="list.items.length ? t.feed.loadingMore : t.feed.loading"></span>
          </div>
        </template>
        <template x-if="!list.loading && list.error">
          <div class="space-y-3">
            <p x-text="t.error[list.error]"></p>
            <button type="button" class="rounded-full bg-estuario text-white px-4 py-2 font-semibold" @click="loadMore()" x-text="t.error.retry"></button>
          </div>
        </template>
        <template x-if="!list.loading && !list.error && list.page > 0 && list.page >= list.totalPages && list.items.length && base.name !== 'saved'">
          <p x-text="t.feed.end"></p>
        </template>
        <template x-if="!list.loading && !list.error && list.page > 0 && !list.items.length && base.name !== 'search' && base.name !== 'saved'">
          <p x-text="t.feed.empty"></p>
        </template>
        <!-- Infinite scroll sentinel -->
        <div x-ref="sentinel" x-intersect:enter.margin.600px="list.page > 0 && loadMore()" class="h-px"></div>
      </div>
    </section>

    <!-- ===== Sections grid ===== -->
    <section x-show="base.name === 'sections'" class="px-4 pt-4">
      <h1 class="font-display text-2xl font-bold mb-4" x-text="t.sections.title"></h1>
      <div class="grid grid-cols-2 gap-3">
        <template x-for="c in categories" :key="c.id">
          <a :href="'#/seccion/' + c.id" class="relative aspect-[4/3] overflow-hidden rounded-xl bg-estuario text-white shadow-sm active:scale-[.98] transition-transform">
            <img :src="c.illustration" alt="" loading="lazy" class="absolute inset-0 size-full object-cover opacity-80" @error="$el.remove()" />
            <span class="absolute inset-0 bg-gradient-to-t from-black/75 via-black/20 to-transparent"></span>
            <span class="absolute bottom-0 p-3">
              <span class="block font-display font-semibold text-lg leading-tight" x-text="c.name"></span>
              <span class="block text-xs opacity-80" x-text="fmt(t.sections.posts, { n: number(c.count) })"></span>
            </span>
          </a>
        </template>
      </div>
      <div x-show="!categories.length" class="py-10 text-center text-muted">
        <button type="button" class="rounded-full bg-estuario text-white px-4 py-2 font-semibold" @click="loadCategories()" x-text="t.error.retry"></button>
      </div>
    </section>

    <!-- ===== Weather ===== -->
    <section x-show="base.name === 'weather'" class="px-4 pt-4 space-y-5">
      <div class="flex items-center justify-between gap-3">
        <h1 class="font-display text-2xl font-bold" x-text="t.weather.title"></h1>
        <button type="button" class="-mr-2 flex size-11 items-center justify-center rounded-full text-muted active:bg-line-soft" :aria-label="t.feed.refresh" @click="loadWeather(true)">
          <svg class="size-5" :class="weather.loading && 'animate-spin'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>

      <div x-show="weather.data?.stale" class="rounded-lg bg-tella/10 text-tella text-sm px-3 py-2" x-text="t.weather.offline"></div>

      <template x-if="!weather.data">
        <div class="py-10 text-center text-muted space-y-3">
          <p x-text="weather.loading ? t.weather.loading : t.weather.unavailable"></p>
          <button type="button" x-show="!weather.loading" class="rounded-full bg-chrome text-white px-4 py-2 font-semibold" @click="loadWeather(true)" x-text="t.error.retry"></button>
        </div>
      </template>

      <template x-if="today">
        <div class="space-y-5">
          <!-- Warning -->
          <template x-if="weather.data.days.some(d => d.warning)">
            <button type="button" class="flex w-full items-center gap-2 rounded-xl bg-tella/10 px-3 py-2.5 text-left text-tella"
                    @click="openExternal('https://www.meteogalicia.gal/web/avisos')">
              <svg class="size-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></svg>
              <span class="flex-1 text-sm font-semibold" x-text="t.weather.warning"></span>
              <span class="text-xs underline" x-text="t.weather.warningMore"></span>
            </button>
          </template>

          <!-- Today -->
          <div class="rounded-2xl bg-surface border border-line-soft shadow-sm p-4">
            <div class="flex items-center gap-4">
              <img :src="skyIcon(today.sky)" alt="" class="size-16 shrink-0" @error="$el.style.visibility='hidden'" />
              <div class="min-w-0 flex-1">
                <p class="text-xs font-semibold uppercase tracking-wider text-tella" x-text="t.weather.today"></p>
                <p class="font-display text-xl font-semibold leading-tight" x-text="skyText(today.sky)"></p>
              </div>
              <div class="text-right tabular-nums">
                <p class="font-display text-3xl font-bold" x-text="today.max != null ? today.max + '°' : '–'"></p>
                <p class="text-muted" x-text="today.min != null ? today.min + '°' : ''"></p>
              </div>
            </div>
            <div class="mt-4 grid grid-cols-3 divide-x divide-line-soft border-t border-line-soft pt-3 text-center">
              <template x-for="p in today.periods" :key="p.key">
                <div class="px-1">
                  <p class="text-xs font-semibold text-muted" x-text="t.weather.periods[p.key]"></p>
                  <img :src="skyIcon(p.sky)" :alt="skyText(p.sky)" class="mx-auto my-1 size-10" @error="$el.style.visibility='hidden'" />
                  <p class="text-sm font-semibold tabular-nums" x-text="p.max != null ? p.max + '°' : ''"></p>
                  <p class="text-xs text-verdemar tabular-nums" x-show="p.rain != null" x-text="t.weather.rain + ' ' + p.rain + '%'"></p>
                  <p class="mt-0.5 text-[.7rem] leading-tight text-muted" x-text="windText(p.wind)"></p>
                </div>
              </template>
            </div>
            <p class="mt-3 text-xs text-muted" x-show="today.uv != null" x-text="t.weather.uv + ': ' + today.uv"></p>
          </div>

          <!-- Next days -->
          <div>
            <h2 class="text-xs font-semibold uppercase tracking-wider text-muted mb-2" x-text="t.weather.nextDays"></h2>
            <ul class="rounded-xl bg-surface border border-line-soft divide-y divide-line-soft overflow-hidden">
              <template x-for="d in weather.data.days.slice(1)" :key="d.date">
                <li class="flex items-center gap-3 px-3 py-2.5">
                  <img :src="skyIcon(d.sky)" :alt="skyText(d.sky)" class="size-9 shrink-0" @error="$el.style.visibility='hidden'" />
                  <div class="min-w-0 flex-1">
                    <p class="font-semibold leading-tight" x-text="dayLabel(d.date)"></p>
                    <p class="truncate text-xs text-muted" x-text="dayDate(d.date) + (skyText(d.sky) ? ' · ' + skyText(d.sky) : '')"></p>
                  </div>
                  <p class="shrink-0 text-right text-xs text-verdemar tabular-nums" x-text="rainMax(d) != null ? rainMax(d) + '%' : ''"></p>
                  <p class="shrink-0 text-right tabular-nums">
                    <span class="font-semibold" x-text="d.max != null ? d.max + '°' : '–'"></span>
                    <span class="text-muted" x-text="d.min != null ? d.min + '°' : ''"></span>
                  </p>
                </li>
              </template>
            </ul>
          </div>

          <!-- Attribution -->
          <p class="text-center text-xs text-muted">
            <button type="button" class="underline" @click="openExternal('https://www.meteogalicia.gal/')" x-text="t.weather.source"></button>
            <span x-show="weather.data.fetchedAt" x-text="' · ' + fmt(t.weather.updated, { time: hourMinute(weather.data.fetchedAt) })"></span>
          </p>
        </div>
      </template>
    </section>

    <!-- ===== Settings ===== -->
    <section x-show="base.name === 'settings'" class="px-4 pt-4 space-y-6">
      <h1 class="font-display text-2xl font-bold" x-text="t.settings.title"></h1>

      <!-- Account (profile management will live here once accounts exist) -->
      <div>
        <h2 class="text-xs font-semibold uppercase tracking-wider text-muted mb-2" x-text="t.settings.account"></h2>
        <div class="flex items-center gap-3 rounded-xl bg-surface border border-line-soft p-4">
          <span class="flex size-11 shrink-0 items-center justify-center rounded-full bg-line-soft text-muted">
            <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <div class="min-w-0">
            <p class="font-semibold" x-text="t.settings.guest"></p>
            <p class="text-sm text-muted" x-text="t.settings.accountSoon"></p>
          </div>
        </div>
      </div>

      <!-- Language -->
      <div>
        <h2 class="text-xs font-semibold uppercase tracking-wider text-muted mb-2" x-text="t.settings.language"></h2>
        <div class="grid grid-cols-2 gap-1 rounded-xl bg-line-soft p-1" role="radiogroup" :aria-label="t.settings.language">
          <template x-for="v in ['es', 'gl']" :key="v">
            <button type="button" role="radio" :aria-checked="prefs.language === v" @click="setPref('language', v)"
                    class="rounded-lg py-2.5 text-sm font-semibold transition-colors"
                    :class="prefs.language === v ? 'bg-raised text-ink shadow-sm' : 'text-muted'" x-text="t.settings.languages[v]"></button>
          </template>
        </div>
        <p class="mt-2 text-xs text-muted" x-text="t.settings.languageHint"></p>
      </div>

      <!-- Appearance -->
      <div>
        <h2 class="text-xs font-semibold uppercase tracking-wider text-muted mb-2" x-text="t.settings.appearance"></h2>
        <div class="grid grid-cols-3 gap-1 rounded-xl bg-line-soft p-1" role="radiogroup" :aria-label="t.settings.appearance">
          <template x-for="v in ['auto', 'light', 'dark']" :key="v">
            <button type="button" role="radio" :aria-checked="prefs.theme === v" @click="setPref('theme', v)"
                    class="rounded-lg py-2.5 text-sm font-semibold transition-colors"
                    :class="prefs.theme === v ? 'bg-raised text-ink shadow-sm' : 'text-muted'" x-text="t.settings.themes[v]"></button>
          </template>
        </div>
        <p class="mt-2 text-xs text-muted" x-text="t.settings.themeHint"></p>
      </div>

      <!-- Text size -->
      <div>
        <h2 class="text-xs font-semibold uppercase tracking-wider text-muted mb-2" x-text="t.settings.textSize"></h2>
        <div class="grid grid-cols-3 gap-1 rounded-xl bg-line-soft p-1" role="radiogroup" :aria-label="t.settings.textSize">
          <template x-for="v in ['normal', 'large', 'xlarge']" :key="v">
            <button type="button" role="radio" :aria-checked="prefs.textSize === v" @click="setPref('textSize', v)"
                    class="rounded-lg py-2.5 text-sm font-semibold transition-colors"
                    :class="prefs.textSize === v ? 'bg-raised text-ink shadow-sm' : 'text-muted'" x-text="t.settings.textSizes[v]"></button>
          </template>
        </div>
        <p class="mt-3 rounded-xl bg-surface border border-line-soft px-4 py-3 font-display text-lg" x-text="t.settings.textPreview"></p>
      </div>
    </section>

    <!-- ===== More ===== -->
    <section x-show="base.name === 'more'" class="px-4 pt-4 space-y-6">
      <h1 class="font-display text-2xl font-bold" x-text="t.more.title"></h1>
      <p class="leading-relaxed" x-text="t.more.about"></p>
      <a href="#/ajustes" class="flex items-center gap-3 rounded-xl bg-surface border border-line-soft px-4 py-3.5 active:bg-line-soft">
        <svg class="size-5 text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span class="flex-1 font-semibold" x-text="t.more.settings"></span>
        <svg class="size-4 text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </a>
      <a href="#/guardadas" class="flex items-center gap-3 rounded-xl bg-surface border border-line-soft px-4 py-3.5 active:bg-line-soft">
        <svg class="size-5 text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <span class="flex-1 font-semibold" x-text="t.more.saved"></span>
        <span class="text-sm text-muted tabular-nums" x-show="savedIds.length" x-text="savedIds.length"></span>
        <svg class="size-4 text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </a>
      <div>
        <h2 class="text-xs font-semibold uppercase tracking-wider text-muted mb-2" x-text="t.more.links"></h2>
        <ul class="rounded-xl bg-surface border border-line-soft divide-y divide-line-soft overflow-hidden">
          <template x-for="l in [
              { label: t.more.website, path: '/' },
              { label: t.more.weather, hash: '#/tiempo' },
              { label: t.more.collaborate, path: '/colaborar/' },
              { label: t.more.rules, path: '/colaborar/normas-de-uso/' },
              { label: t.more.legal, path: '/colaborar/legal/' },
            ]" :key="l.label">
            <li>
              <button type="button" class="flex w-full items-center justify-between px-4 py-3.5 text-left active:bg-line-soft" @click="l.hash ? (location.hash = l.hash) : openSite(l.path)">
                <span x-text="l.label"></span>
                <svg class="size-4 text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path :d="l.hash ? 'm9 18 6-6-6-6' : 'M7 17 17 7M8 7h9v9'"/></svg>
              </button>
            </li>
          </template>
        </ul>
      </div>
      <p class="text-center text-xs text-muted" x-text="fmt(t.more.version, { v: version })"></p>
    </section>
  </main>

  <!-- ===== Article overlay ===== -->
  <div x-show="route.name === 'article'" x-ref="articleScroll"
       x-transition:enter="transition ease-out duration-200" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0"
       x-transition:leave="transition ease-in duration-150" x-transition:leave-start="translate-x-0" x-transition:leave-end="translate-x-full"
       class="fixed inset-0 z-40 overflow-y-auto overscroll-contain bg-ground" :inert="lightbox.open">
    <div class="sticky top-0 z-10 bg-chrome text-white pt-safe">
      <div class="flex items-center justify-between px-2 h-13">
        <button type="button" class="flex min-h-11 items-center gap-1 rounded-full px-2 active:bg-white/10" @click="back()">
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          <span class="font-semibold" x-text="t.article.back"></span>
        </button>
        <div class="flex items-center">
        <button type="button" class="flex size-11 items-center justify-center rounded-full active:bg-white/10" x-show="article.data"
                :aria-label="article.data && isSaved(article.data.id) ? t.article.unsave : t.article.save"
                :aria-pressed="article.data && isSaved(article.data.id)" @click="toggleSaved()">
          <svg class="size-5" viewBox="0 0 24 24" :fill="article.data && isSaved(article.data.id) ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </button>
        <button type="button" class="flex size-11 items-center justify-center rounded-full active:bg-white/10" :aria-label="t.article.share" @click="share()" x-show="article.data">
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
        </button>
        </div>
      </div>
    </div>

    <template x-if="article.data">
      <article class="pb-[calc(6rem+var(--sa-bottom))]">
        <!-- Photos already appear in the body; only the section illustration is used as a header. -->
        <template x-if="article.data.image && (article.data.image.fallback || !article.full)">
          <div class="bg-line-soft" :class="article.data.image.landscape ? 'aspect-[16/9]' : 'flex justify-center'">
            <img :src="article.data.image.url" :alt="article.data.image.alt" @click="openLightbox($el)"
                 :class="article.data.image.landscape ? 'size-full object-cover' : 'max-h-[70vh] w-auto object-contain'" />
          </div>
        </template>
        <div class="px-4 pt-5">
          <p class="text-xs font-semibold uppercase tracking-wider text-tella" x-text="mainCategory(article.data)"></p>
          <h1 x-ref="articleTitle" tabindex="-1" class="mt-1 font-display text-[1.75rem] font-bold leading-tight outline-none" x-text="article.data.title"></h1>
          <p class="mt-3 text-sm text-muted">
            <span class="first-letter:uppercase inline-block" x-text="longDate(article.data.date)"></span>
            <template x-if="article.data.author"><span class="block" x-text="fmt(t.article.by, { author: article.data.author })"></span></template>
          </p>

          <!-- Body -->
          <template x-if="article.full">
            <div class="post-body mt-6" x-html="article.data.content" @click="onContentClick($event)"></div>
          </template>
          <template x-if="!article.full && article.loading">
            <div class="mt-6 space-y-3 animate-pulse" :aria-label="t.article.loading">
              <div class="h-4 rounded bg-line"></div><div class="h-4 rounded bg-line w-11/12"></div>
              <div class="h-4 rounded bg-line w-10/12"></div><div class="h-4 rounded bg-line w-9/12"></div>
            </div>
          </template>

          <button type="button" class="mt-8 w-full rounded-xl border border-line py-3 font-semibold text-verdemar active:bg-line-soft"
                  @click="openExternal(article.data.link)" x-text="t.article.openWeb"></button>
        </div>

        <!-- Related posts ("Más sobre esto"), same idea as the website footer -->
        <section class="px-4 mt-10" x-show="article.full && related.id === article.data.id && (related.loading || related.items.length)">
          <h2 class="font-display text-xl font-bold mb-3" x-text="t.article.related"></h2>
          <div class="space-y-3">
            <template x-for="p in related.items" :key="p.id">
              <button type="button" class="flex w-full gap-3 rounded-xl bg-surface border border-line-soft p-2.5 text-left shadow-sm active:scale-[.99] transition-transform"
                      @click="showPost(p)">
                <span class="size-20 shrink-0 overflow-hidden rounded-lg bg-line-soft">
                  <template x-if="p.image">
                    <img :src="p.image.url" :alt="p.image.alt" loading="lazy" decoding="async" class="size-full object-cover" @error="$el.remove()" />
                  </template>
                </span>
                <span class="min-w-0 flex-1">
                  <span class="block text-[.7rem] font-semibold uppercase tracking-wider text-tella" x-text="mainCategory(p)"></span>
                  <span class="mt-0.5 block font-display font-semibold leading-snug line-clamp-3" x-text="p.title"></span>
                  <span class="mt-1 block text-xs text-muted" x-text="when(p)"></span>
                </span>
              </button>
            </template>
            <template x-if="related.loading">
              <div class="space-y-3 animate-pulse">
                <div class="h-24 rounded-xl bg-line-soft"></div><div class="h-24 rounded-xl bg-line-soft"></div>
              </div>
            </template>
          </div>
        </section>
      </article>
    </template>

    <template x-if="!article.data && article.loading">
      <div class="flex items-center justify-center gap-2 py-16 text-muted">
        <span class="size-4 rounded-full border-2 border-verdemar border-t-transparent animate-spin"></span>
        <span x-text="t.article.loading"></span>
      </div>
    </template>
    <template x-if="article.error">
      <div class="px-4 py-10 text-center space-y-3">
        <p x-text="t.error[article.error]"></p>
        <button type="button" class="rounded-full bg-estuario text-white px-4 py-2 font-semibold" @click="openArticle(article.id)" x-text="t.error.retry"></button>
      </div>
    </template>
  </div>

  <!-- ===== Bottom tab bar ===== -->
  <!-- Above the article overlay (z-40) so it is always reachable. -->
  <nav class="fixed inset-x-0 bottom-0 z-50 bg-chrome pb-safe" :inert="lightbox.open" :aria-label="t.tabs.home">
    <div class="grid grid-cols-4">
      <template x-for="tab in [
          { name: 'home', hash: '#/', label: t.tabs.home, icon: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z' },
          { name: 'sections', hash: '#/secciones', label: t.tabs.sections, icon: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z' },
          { name: 'search', hash: '#/buscar', label: t.tabs.search, icon: 'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-3.5-3.5' },
          { name: 'more', hash: '#/mas', label: t.tabs.more, icon: 'M5 12h.01M12 12h.01M19 12h.01' },
        ]" :key="tab.name">
        <a :href="tab.hash" class="flex flex-col items-center gap-0.5 pt-2 pb-1.5 text-[.7rem] font-semibold"
           :class="isTab(tab.name) ? 'text-white' : 'text-white/70'" :aria-current="isTab(tab.name) ? 'page' : null"
           @click="isTab(tab.name) && route.name !== 'article' && window.scrollTo({ top: 0, behavior: 'smooth' })">
          <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path :d="tab.icon"/></svg>
          <span x-text="tab.label"></span>
        </a>
      </template>
    </div>
  </nav>

  <!-- ===== Image viewer (above everything, incl. the tab bar) ===== -->
  <div x-show="lightbox.open" x-transition.opacity.duration.150ms x-ref="lightbox"
       class="fixed inset-0 z-[80] flex items-center justify-center overflow-hidden bg-black select-none"
       style="touch-action: none" role="dialog" aria-modal="true" :aria-label="lightbox.alt || t.article.closeImage">
    <img x-ref="lightboxImg" :src="lightbox.src" :alt="lightbox.alt" draggable="false"
         class="max-h-full max-w-full object-contain will-change-transform" />
    <button type="button" x-ref="lightboxClose" @click="closeLightbox()" :aria-label="t.article.closeImage"
            class="absolute right-3 flex size-11 items-center justify-center rounded-full bg-black/60 text-white" style="top: calc(var(--sa-top) + 0.75rem)">
      <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <p x-show="lightbox.hint" x-transition.opacity.duration.400ms class="pointer-events-none absolute inset-x-0 text-center text-xs text-white/70" style="bottom: calc(var(--sa-bottom) + 1rem)" x-text="t.article.imageHint"></p>
  </div>

  <!-- ===== Toast ===== -->
  <div x-show="toast" x-transition.opacity role="status" aria-live="polite"
       class="fixed inset-x-0 bottom-[calc(5rem+var(--sa-bottom))] z-[60] flex justify-center pointer-events-none">
    <span class="rounded-full bg-ink text-ground px-4 py-2 text-sm shadow-lg" x-text="toast"></span>
  </div>
</body>
</html>
